[package]
name = "health-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A portable, structured, auditable health record and deterministic analysis engine"
license = "MIT"
repository = "https://github.com/csells/health-engine"
keywords = ["health", "genomics", "clinical", "sqlite", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
csv = "1.4.0"
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
schemars = { version = "1.2.2", features = ["chrono04", "rust_decimal1", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v5", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "health-engine"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
